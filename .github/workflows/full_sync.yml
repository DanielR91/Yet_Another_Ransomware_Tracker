name: Full Historical Sync

on:
  workflow_dispatch: # Manual trigger

jobs:
  full-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create data directories
        run: mkdir -p data/groups

      - name: Fetch Global Data
        env:
          API_KEY: ${{ secrets.RANSOMWARE_LIVE_API_KEY }}
        run: |
          curl -s -H "X-API-KEY: $API_KEY" https://api-pro.ransomware.live/recentvictims > data/recentvictims.json
          curl -s -H "X-API-KEY: $API_KEY" https://api-pro.ransomware.live/groups > data/groups.json
          curl -s -H "X-API-KEY: $API_KEY" https://api-pro.ransomware.live/recentcyberattacks > data/recentcyberattacks.json || echo "[]" > data/recentcyberattacks.json

      - name: Fetch Detailed Group Data
        env:
          API_KEY: ${{ secrets.RANSOMWARE_LIVE_API_KEY }}
        run: |
          # Extract group names into an array safely
          groups=$(jq -r 'if .groups then .groups[]?.group else empty end' data/groups.json)
          
          if [ -z "$groups" ]; then
            echo "Error: Failed to parse groups from API response. Raw response was:"
            cat data/groups.json
            exit 1
          fi
          
          for group in $groups; do
            if [ "$group" != "null" ] && [ -n "$group" ]; then
              echo "Fetching historical data for group: $group"
              mkdir -p "data/groups/$group"
              
              curl -s -H "X-API-KEY: $API_KEY" "https://api-pro.ransomware.live/groups/$group" > "data/groups/$group/info.json" || echo "{}" > "data/groups/$group/info.json" || true
              curl -s -H "X-API-KEY: $API_KEY" "https://api-pro.ransomware.live/victims/?group=$group" > "data/groups/$group/victims.json" || echo "[]" > "data/groups/$group/victims.json" || true
              curl -s -H "X-API-KEY: $API_KEY" "https://api-pro.ransomware.live/iocs/$group" > "data/groups/$group/iocs.json" || echo "{}" > "data/groups/$group/iocs.json" || true
              curl -s -H "X-API-KEY: $API_KEY" "https://api-pro.ransomware.live/yara/$group" > "data/groups/$group/yara.json" || echo "[]" > "data/groups/$group/yara.json" || true
              
              # Negotiations
              curl -s -H "X-API-KEY: $API_KEY" "https://api-pro.ransomware.live/negotiations/$group" > "data/groups/$group/negotiations.json" || echo "[]" > "data/groups/$group/negotiations.json" || true
              chats=$(jq -r '.[].id' "data/groups/$group/negotiations.json" 2>/dev/null || echo "")
              for chat in $chats; do
                 if [ "$chat" != "null" ] && [ -n "$chat" ]; then
                   curl -s -H "X-API-KEY: $API_KEY" "https://api-pro.ransomware.live/negotiations/$group/$chat" > "data/groups/$group/chat_$chat.json" || true
                 fi
              done

              # Ransom notes
              curl -s -H "X-API-KEY: $API_KEY" "https://api-pro.ransomware.live/ransomnotes/$group" > "data/groups/$group/notes_list.json" || echo "[]" > "data/groups/$group/notes_list.json" || true
              notes=$(jq -r '.[]?' "data/groups/$group/notes_list.json" 2>/dev/null || echo "")
              for note in $notes; do
                 if [ "$note" != "null" ] && [ -n "$note" ]; then
                   curl -s -H "X-API-KEY: $API_KEY" "https://api-pro.ransomware.live/ransomnotes/$group/$note" > "data/groups/$group/note_$note.json" || true
                 fi
              done
              
              # Sleep briefly to be nice to the API
              sleep 0.5
            fi
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated full historical sync [skip ci]"
          git push
