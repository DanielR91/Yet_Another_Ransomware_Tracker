name: Update Data Hourly

on:
  schedule:
    - cron: '0 * * * *' # Runs at the top of every hour
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create data directory
        run: mkdir -p data/groups

      - name: Fetch Global Data
        env:
          API_KEY: ${{ secrets.RANSOMWARE_LIVE_API_KEY }}
        run: |
           # Fetch Recent Victims with fallback on failure
           curl -s -f -H "X-API-KEY: $API_KEY" https://api-pro.ransomware.live/recentvictims -o data/recentvictims.json || echo "[]" > data/recentvictims.json
           # Ensure JSON validity before parsing
           if jq -e . data/recentvictims.json > /dev/null 2>&1; then
             active_groups=$(jq -r 'if type=="array" then .[]?.group elif .groups then .groups[]?.group else empty end' data/recentvictims.json | sort -u)
           else
             echo "Warning: recentvictims.json is not valid JSON, skipping active groups."
             active_groups=""
           fi || echo "[]" > data/recentvictims.json
           curl -s -f -H "X-API-KEY: $API_KEY" https://api-pro.ransomware.live/groups -o data/groups.json || echo "{}" > data/groups.json
           curl -s -f -H "X-API-KEY: $API_KEY" https://api-pro.ransomware.live/stats -o data/stats.json || echo "{}" > data/stats.json
           curl -s -f -H "X-API-KEY: $API_KEY" https://api-pro.ransomware.live/listsectors -o data/sectors.json || echo "[]" > data/sectors.json
           curl -s -f -H "X-API-KEY: $API_KEY" https://api-pro.ransomware.live/8k -o data/8k.json || echo "[]" > data/8k.json
           curl -s -f -H "X-API-KEY: $API_KEY" https://api-pro.ransomware.live/press/recent -o data/press.json || echo "[]" > data/press.json

      - name: Fetch Data for Active Groups Only
        env:
          API_KEY: ${{ secrets.RANSOMWARE_LIVE_API_KEY }}
        run: |
           # Parse recent victims to find groups with recent activity safely (supports both array and "groups" object)
           active_groups=$(jq -r 'if type=="array" then .[]?.group elif .groups then .groups[]?.group else empty end' data/recentvictims.json | sort -u)
          
          if [ -z "$active_groups" ]; then
            echo "Error: Failed to parse recent victims from API response. Raw response was:"
            cat data/recentvictims.json
            exit 1
          fi
          
          for group in $active_groups; do
            if [ "$group" != "null" ] && [ -n "$group" ]; then
              echo "Incremental update for active group: $group"
              mkdir -p "data/groups/$group"
              
              curl -s -H "X-API-KEY: $API_KEY" "https://api-pro.ransomware.live/groups/$group" > "data/groups/$group/info.json" || echo "{}" > "data/groups/$group/info.json"
              curl -s -H "X-API-KEY: $API_KEY" "https://api-pro.ransomware.live/victims/?group=$group" > "data/groups/$group/victims.json" || echo "[]" > "data/groups/$group/victims.json"
              curl -s -H "X-API-KEY: $API_KEY" "https://api-pro.ransomware.live/iocs/$group" > "data/groups/$group/iocs.json" || echo "{}" > "data/groups/$group/iocs.json"
            fi
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated incremental data update [skip ci]"
          git push
