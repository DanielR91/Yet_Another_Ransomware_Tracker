<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Victims - Ransomware Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar glass-panel">
            <div class="logo-area">
                <i class="fa-solid fa-shield-virus neon-icon"></i>
                <h2>RansomTracker</h2>
            </div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
                <a href="victims.html" class="nav-link active"><i class="fa-solid fa-users-slash"></i> All Victims</a>
                <a href="groups.html" class="nav-link"><i class="fa-solid fa-user-ninja"></i> All Groups</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div>
                    <h1>All Victims Database</h1>
                    <p class="subtitle">Complete historical list of observed ransomware victims</p>
                </div>
            </header>

            <section class="table-section glass-panel mt-4">
                <div class="section-header">
                    <h3>Victim Search</h3>
                    <div class="search-box">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="search-victims" placeholder="Search by name, group, or country...">
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="data-table" id="victims-table">
                        <thead>
                            <tr>
                                <th>Victim</th>
                                <th>Group</th>
                                <th>Attack Date</th>
                                <th>Country</th>
                                <th>URL</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="5">Loading data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="js/victims.js"></script>
</body>
</html>
